[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mariadb]
command=/usr/bin/mysqld_safe --datadir=/var/lib/mysql
autostart=true
autorestart=true
priority=1

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
priority=2

[program:cron_runner]
command=/bin/bash -c "sleep 15; while true; do curl -s http://127.0.0.1:${PORT:-80}/crons/cron.php > /dev/null 2>&1; sleep 60; done"
autostart=true
autorestart=true
priority=3
